training:
  - id: e-ai-ml2
    title: "E-AI Intensive Course on AI/ML"
    date: "January 2026"
    description: >
      A structured, hands-on introduction to modern AI/ML methods with a strong focus on weather and climate applications. Includes operational perspectives, reproducibility, and best practices for building reliable ML workflows. Covers Python, PyTorch, LLMs, Diffusion, Agents, MLOps, Anemoi, and AIFS/AICON.
    githubLink: "https://github.com/eumetnet-e-ai/e-ai_ml2"
    slidesLink: "https://raw.githubusercontent.com/eumetnet-e-ai/e-ai_ml2/main/course/e-ai_ml2.pdf"
    type: "Course"
    tags: ["ML", "Deep Learning", "LLMs", "MLOps", "Anemoi"]

  - id: eai-zarr-workshop
    title: "Introduction to Zarr Workshop"
    date: "Spring 2026"
    description: >
      Materials for the E-AI Spring Workshop 2026 Zarr Hands-On Session. Includes practical Jupyter notebooks and environment setup guides for working efficiently with cloud-optimized Zarr data formats in Python.
    githubLink: "https://github.com/annaerdmann/eai-zarr-workshop"
    type: "Workshop"
    tags: ["Zarr", "Data Formats", "Python", "Cloud"]

  - id: e-ai-basics-6
    title: "Tutorial E-AI Basics 6: CI/CD - Continuous Integration and Continuous Deployment of ML codes"
    date: "February 2025"
    description: >
      Practical CI/CD guidance tailored to ML projects: what CI/CD can do for ML teams, writing basic tests with pytest, and setting up runners and pipelines for automated testing and deployment.
      Sections:

      - 6.1 Overview – What can CI/CD do for you?

      - 6.2 Basic tests with Pytest

      - 6.3 Setting up a runner
    githubLink: "https://github.com/eumetnet-e-ai/tutorials/tree/main/tutorial6"
    slidesLink: "https://raw.githubusercontent.com/eumetnet-e-ai/tutorials/main/tutorial6/E-AI_Talks_Basics_06_CICD_final.pdf"
    type: "Tutorial"
    tags: ["CI/CD", "Testing", "Pytest", "DevOps", "MLOps"]

  - id: e-ai-basics-5
    title: "Tutorial E-AI Basics 5: MLflow - an open-source platform for managing the machine learning lifecycle"
    date: "February 2025"
    description: >
      Hands-on guidance for using MLflow from both user and developer perspectives. Covers logging experiments, integrating MLflow into code and deploying an MLflow server as a user or service.
      Sections:

      - 5.1 Overview - User perspective

      - 5.2 Logging to MLflow as a ML software developer

      - 5.3 Running MLflow server as a user and as a service
    githubLink: "https://github.com/eumetnet-e-ai/tutorials/tree/main/tutorial5"
    slidesLink: "https://raw.githubusercontent.com/eumetnet-e-ai/tutorials/main/tutorial5/E-AI_Talks_Basics_05_MLflow_all.pdf"
    type: "Tutorial"
    tags: ["MLflow", "Experiment Tracking", "Deployment", "MLOps"]

  - id: e-ai-basics-4
    title: "Tutorial E-AI Basics 4: MLOps - Machine Learning Operations"
    date: "January 2025"
    description: >
      Overview of MLOps principles and practices, including how they relate to traditional weather forecasting workflows and steps to operationalize ML systems.
      Sections:

      - 4.1 Overview

      - 4.2 MLOps in relation to traditional Weather forecasting

      - 4.3 Road to MLOps
    githubLink: "https://github.com/eumetnet-e-ai/tutorials/tree/main/tutorial4"
    slidesLink: "https://raw.githubusercontent.com/eumetnet-e-ai/tutorials/main/tutorial4/E-AI_Talks_Basics_04_MLOps_final.pdf"
    type: "Tutorial"
    tags: ["MLOps", "Operationalization", "Forecasting", "Reproducibility"]

  - id: e-ai-basics-3
    title: "Tutorial E-AI Basics 3: LLM Use, Transformer Example, RAG"
    date: "September 2024"
    description: >
      Practical introduction to Large Language Models, transformer architectures and retrieval-augmented generation (RAG) with examples and API usage guidance.
      Sections:

      - 3.1 Intro to LLM Use and APIs

      - 3.2 Transformer for Language and Images

      - 3.3 LLM Retrieval Augmented Generation (RAG)
    githubLink: "https://github.com/eumetnet-e-ai/tutorials/tree/main/tutorial3"
    slidesLink: "https://raw.githubusercontent.com/eumetnet-e-ai/tutorials/main/tutorial3/E-AI_Talks_Basics_03_LLM_Transformer_RAG.pdf"
    type: "Tutorial"
    tags: ["LLM", "Transformers", "RAG", "APIs"]

  - id: e-ai-basics-2
    title: "Tutorial E-AI Basics 2: Dynamics, Downscaling, Data Assimilation Examples"
    date: "September 2024"
    description: >
      Examples applying ML to dynamical prediction, spatial downscaling and data recovery/assimilation. Focused on model architectures and practical notebooks for weather/climate use-cases.
      Sections:

      - 2.1 Dynamic Prediction by a Graph NN

      - 2.2 Data Recovery/Denoising via Encoder-Decoder

      - 2.3 AI for Data Assimilation
    githubLink: "https://github.com/eumetnet-e-ai/tutorials/tree/main/tutorial2"
    slidesLink: "https://raw.githubusercontent.com/eumetnet-e-ai/tutorials/main/tutorial2/E-AI_Talks_Basics_02_Dynamics_EnDecoder_Data_Assimilation_v3.pdf"
    type: "Tutorial"
    tags: ["Dynamics", "Downscaling", "Data Assimilation", "Graph NN", "Encoder-Decoder"]

  - id: e-ai-basics-1
    title: "Tutorial E-AI Basics 1: Intro, Environment, First Example"
    date: "September 2024"
    description: >
      Introductory tutorial covering the basic ideas of AI techniques, recommended work environments, and a first hands-on example to get started quickly.
      Sections:

      - 1.1 Basic Ideas of AI Techniques

      - 1.2 Work Environment

      - 1.3 First Example for AI - hands-on
    githubLink: "https://github.com/eumetnet-e-ai/tutorials/tree/main/tutorial1"
    slidesLink: "https://raw.githubusercontent.com/eumetnet-e-ai/tutorials/main/tutorial1/E-AI_Talks_Basics_01_Intro_Environment_First_AI_Example_v2.pdf"
    type: "Tutorial"
    tags: ["AI", "Introduction", "Python", "Hands-on"]