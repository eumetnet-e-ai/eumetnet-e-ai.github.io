applications:
  - id: statistical-downscaling-gan
    title: Statistical Downscaling GAN
    short: Generative downscaling of precipitation from 25 km to 1 km.
    description: |
      Conditional GAN producing physically plausible high-resolution precipitation fields conditioned on coarse NWP output. Calibrated against radar-gauge analyses over Central Europe.
    organization_modules:
      - post-processing
    domains:
      - downscaling
      - precipitation
      - generative
    organization: MeteoSwiss
    eumetnet_member: true
    packages:
      - name: torch
        maintained_by_eumetnet: false
      - name: climetlab
        url: https://github.com/ecmwf/climetlab
        maintained_by_eumetnet: true
    working_groups:
      - wg-11
  - id: satellite-cloud-classification
    title: Satellite Cloud Classification
    short: Pixel-wise cloud type classification from MTG-I imagery.
    description: |
      Transformer-based segmentation of cloud regimes from Meteosat Third Generation imagery, producing inputs for nowcasting and data assimilation. Trained on collocated CloudSat/CALIPSO labels.
    organization_modules:
      - data-curation
    domains:
      - satellite
      - classification
    organization: EUMETSAT (collaboration)
    eumetnet_member: false
    packages:
      - name: torch
        maintained_by_eumetnet: false
      - name: satpy
        url: https://satpy.readthedocs.io
        maintained_by_eumetnet: false
      - name: pyresample
        url: https://pyresample.readthedocs.io
        maintained_by_eumetnet: false
    working_groups:
      - wg-1
  - id: ensemble-postprocessing-drn
    title: Ensemble Post-processing (DRN)
    short: Distributional regression networks for calibrated 2 m temperature.
    description: |
      Neural network producing calibrated parametric forecast distributions from raw ensemble output. Operational for 2 m temperature and 10 m wind speed at several EUMETNET centres.
    organization_modules:
      - post-processing
    domains:
      - calibration
      - ensemble
      - bias_correction
    organization: MET Norway
    eumetnet_member: true
    packages:
      - name: torch
        maintained_by_eumetnet: false
      - name: properscoring
        maintained_by_eumetnet: false
      - name: anemoi-utils
        url: https://github.com/ecmwf/anemoi-utils
        maintained_by_eumetnet: true
    working_groups:
      - wg-13
  - id: anemoi-framework
    title: Anemoi
    short: Framework for data-driven forecasting
    description: |
      A comprehensive framework to support data-driven forecasting operations,  developed as part of the EUMETNET E-AI activities to bridge research and operations.
