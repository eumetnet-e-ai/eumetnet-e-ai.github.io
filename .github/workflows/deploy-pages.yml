name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Build with Vite
        env:
          BASE_URL: /${{ github.event.repository.name }}/
        run: bun run build
      - name: Locate build output
        id: out
        run: |
          if [ -d "dist/client" ]; then
            echo "dir=dist/client" >> "$GITHUB_OUTPUT"
          else
            echo "dir=dist" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup index.html for SPA
        run: |
          DIR="${{ steps.out.outputs.dir }}"
          if [ -f "$DIR/_shell.html" ]; then
            cp "$DIR/_shell.html" "$DIR/index.html"
          fi
      - name: SPA fallback (copy index.html -> 404.html)
        run: |
          DIR="${{ steps.out.outputs.dir }}"
          if [ -f "$DIR/index.html" ]; then
            cp "$DIR/index.html" "$DIR/404.html"
          fi
      - name: Disable Jekyll
        run: touch "${{ steps.out.outputs.dir }}/.nojekyll"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.out.outputs.dir }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
